[package]
name = "gcd_voxel_game"
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Profile for distribution
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[features]
dev = ["bevy/dynamic_linking"]

[dependencies]
bevy = { version = "0.18", features = [
    "std",
    "async_executor",
    "gltf_animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_dev_tools",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_input_focus",
    "bevy_log",
    "mesh_picking",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_image",
    "bevy_mesh",
    "bevy_camera",
    "bevy_light",
    "bevy_shader",
    "bevy_sprite",
    "sprite_picking",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "ui_picking",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "hdr",
    "ktx2",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "smaa_luts",
    "sysinfo_plugin",
    "tonemapping_luts",
    "webgl2",
    "x11",
    "wayland",
    "debug",
    "zstd_rust",
] }

bevy_asset_loader = { version = "0.25", features = ["3d"] }
bevy_egui = "0.39.1"
bevy_voxel_world = { path = "../bevy_voxel_world" }

noise = { version = "0.9.0", features = ["image", "images"] }
rand = "0.9.2"
splines = "5.0.0"

# keep the following in sync with Bevy's dependencies
winit = { version = "0.30.12", default-features = false }
image = { version = "0.25.9", default-features = false }
## This greatly improves WGPU's performance due to its heavy use of trace! calls
log = { version = "0.4.29", features = [
    "max_level_debug",
    "release_max_level_warn",
] }

block-mesh = "0.2.0"
mimalloc = { version = "0.1.48", default-features = false }
arc-swap = "1.9.1"
serde = { version = "1.0.228", features = ["derive"] }
ron = "0.12.1"
tempfile = "3.27.0"
directories = "6.0.0"
simdnoise = "3.1.6"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[build-dependencies]
embed-resource = "3.0.6"
